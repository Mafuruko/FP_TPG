<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#202e25">
  <title>Island Colony Sandbox</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/studio/ui.css">
  <link rel="stylesheet" href="/game.css">
  <script type="module" src="/src/main.js"></script>
</head>
<body>
  <main class="gu pixel">
    <canvas id="island" aria-label="Interactive island map" aria-describedby="controls"></canvas>
    <div id="studio-hud"></div>
    <section id="panel" class="panel gu-panel" aria-labelledby="panel-title" hidden>
      <div class="panel-heading">
        <h2 id="panel-title" class="gu-title" tabindex="-1"></h2>
        <div class="row">
          <button type="button" class="gu-btn s" id="back-panel" hidden>Back</button>
          <button type="button" class="gu-btn s ib" id="close-panel" aria-label="Close menu">×</button>
        </div>
      </div>
      <div id="panel-content"></div>
    </section>
    <div class="bottom">
      <button type="button" id="debug" class="gu-btn s" aria-pressed="false" aria-controls="debug-panel">Debug</button>
      <p id="controls">Drag to pan · Scroll to zoom · Select a villager, then click a tile to move</p>
    </div>
    <section id="debug-panel" class="panel gu-panel debug" aria-label="Developer tools" hidden>
      <h2>Developer tools</h2>
      <div id="overlays"></div>
      <p>Collectibles on the map are previews.</p>
      <pre id="inspector"></pre>
    </section>
    <div id="title-screen" hidden></div>
  </main>
</body>
</html>
